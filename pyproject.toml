[project]
name = "dipbench"
version = "0.1.0"
description = "LLM benchmark harness for Diplomacy on the unmodified diplomacy engine"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "diplomacy==1.1.2",
    "anthropic>=2.8",
    "openai>=3.49",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.setuptools.packages.find]
include = ["dipbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
